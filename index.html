    R.createElement('div',{className:'mono',style:{fontSize:12,color:'var(--rs)'}},'404 · ROTTA NON TROVATA: '+route),
    R.createElement('div',{style:{marginTop:12}},R.createElement(Btn,{variant:'au',onClick:function(){nav('/')}},'HOME')));

  return R.createElement(LangCtx.Provider,{value:ctx},
    R.createElement('div',null,

      flash?R.createElement('div',{className:'routeflash'}):null,
