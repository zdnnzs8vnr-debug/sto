server {
  listen 443 ssl http2;
  server_name example.com;
  root /var/www/gustavoeuro;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://i.ibb.co https://*.ibb.co https://api.qrserver.com; connect-src 'self' https://api.qrserver.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(png|gif|jpg|jpeg|webp|svg)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location ~ /\. { deny all; }
  error_page 404 /404.html;
}
