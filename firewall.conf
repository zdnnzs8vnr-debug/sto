# ---- rate limiting ----
limit_req_zone $binary_remote_addr zone=ge_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ge_strict:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=ge_conn:10m;

# ---- geo / ASN blacklist opzionale ----
geo $ge_block { default 0; }

server {
  limit_conn ge_conn 24;
  limit_req zone=ge_general burst=60 nodelay;

  # scanner / bot cattivi
  if ($http_user_agent ~* "(nikto|sqlmap|nmap|masscan|wpscan|zgrab|dirbuster|gobuster|feroxbuster)") {
    set $ge_scanner 1;
  }

  location / {
    limit_req zone=ge_strict burst=20 nodelay;
    if ($ge_block) { return 403; }
    try_files $uri $uri/ /index.html;
  }

  # sfida rapida per POST strani
  location ~ \.(php|asp|aspx|jsp)$ { try_files $uri /index.html; }

  # nascondi file sensibili
  location ~ /\.(git|env|htaccess|nojekyll) { deny all; }

  # blocca referrer spam noto
  if ($http_referer ~* "(semalt|buttons-for-website|darodar|social-buttons)") { set $ge_block 1; }
}
